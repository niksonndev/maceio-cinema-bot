[package]
name = "maceio-cine-telegram"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "telegram-webhook"
path = "src/main.rs"

[[bin]]
name = "telegram-fetch"
path = "src/fetch.rs"

[[bin]]
name = "telegram-poll"
path = "src/polling.rs"

[dependencies]
axum = "0.8"
aws-config = "1"
aws-sdk-s3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
dashmap = "6"
dotenvy = "0.15"
lambda_http = "1.3"
lambda_runtime = "1.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"