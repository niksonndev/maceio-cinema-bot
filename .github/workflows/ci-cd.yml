name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: telegram/rust

      - name: Install Cargo Lambda
        run: |
          NPM_CONFIG_PREFIX="$HOME/.local" sh -c "$(curl -fsSL https://cargo-lambda.info/install.sh)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - run: sam validate --template-file template.yaml
      - run: sam build --template-file template.yaml

  whatsapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: whatsapp

      - run: cargo test
      - run: cargo build --release

  deploy:
    needs: [telegram, whatsapp]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: sa-east-1
      STACK_NAME: maceio-cine-bot
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: telegram/rust

      - name: Install Cargo Lambda
        run: |
          NPM_CONFIG_PREFIX="$HOME/.local" sh -c "$(curl -fsSL https://cargo-lambda.info/install.sh)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Build and deploy
        run: |
          sam build --template-file template.yaml
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --no-progressbar \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              "TelegramBotToken=${TELEGRAM_BOT_TOKEN}" \
              "OMDbApiKey=${OMDB_API_KEY}" \
              "TMDbApiKey=${TMDB_API_KEY}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDb_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Warm cache and register webhook
        run: bash scripts/sam-warm.sh
